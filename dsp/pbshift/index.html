<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>实时 pbshift 移调器</title>
    <link rel="stylesheet" href="../../main.css">
    <script defer src="demo.js"></script>
    <style>
        .controls { max-width: 56rem; margin: 1rem 0; }
        .controls fieldset { margin-bottom: .75rem; }
        .control-row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: .5rem 0; }
        .control-row label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
        #wave { display: block; width: 100%; height: 9rem; background: #101214; border: 1px solid #2e3238; }
    </style>
</head>
<body class="page">
    <div class="page-header">
        <button onclick="location.href='../../index.html'">back</button>
        <b>实时 pbshift 移调器</b>
    </div>
    <div class="page-body">
        <main class="page-content">
            <h2>实时 pbshift 移调器</h2>
            <p>用本地音频文件或麦克风试听 <a href="https://github.com/pbtechlab/pbshift">pbshift</a> 的实时移调。麦克风监听建议佩戴耳机。音频在浏览器本地处理。</p>

            <div class="controls">
                <fieldset>
                    <legend>音源</legend>
                    <div class="control-row">
                        <label>音频文件 <input id="file" type="file" accept="audio/*"></label>
                        <button class="win-btn" id="play" disabled>播放文件</button>
                        <label><input id="loop" type="checkbox" checked> 循环</label>
                    </div>
                    <div class="control-row">
                        <button class="win-btn" id="mic">开始麦克风监听</button>
                        <button class="win-btn" id="pause" disabled>暂停</button>
                        <button class="win-btn" id="stop" disabled>停止</button>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>移调参数</legend>
                    <div class="control-row">
                        <label>音高 <input id="pitch" type="range" min="-24" max="24" step="1" value="0">
                            <output id="pitchValue" for="pitch">0 半音</output></label>
                        <label>输出音量 <input id="volume" type="range" min="0" max="150" step="5" value="100">
                            <output id="volumeValue" for="volume">100%</output></label>
                    </div>
                    <div class="control-row">
                        <label>模式 <select id="mode">
                            <option value="0">Auto</option>
                            <option value="1">Voice</option>
                            <option value="2">Rhythm</option>
                            <option value="3">Music</option>
                        </select></label>
                        <label>延迟档位 <select id="tier">
                            <option value="0">Live</option>
                            <option value="1" selected>StudioRT</option>
                        </select></label>
                        <label><input id="formants" type="checkbox"> 保留共振峰</label>
                        <label><input id="bypass" type="checkbox"> 旁路</label>
                    </div>
                    <p id="latency"></p>
                </fieldset>

                <p id="status" role="status">请选择音频文件或启动麦克风监听。</p>
                <canvas id="wave" width="900" height="144" aria-label="输出波形"></canvas>
            </div>
        </main>
    </div>
</body>
</html>
